services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: townlight_records
      POSTGRES_PASSWORD: townlight_records
      POSTGRES_DB: townlight_records
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U townlight_records"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    secrets:
      - jwt_secret
      - first_admin_password
    ports:
      - "${TOWNLIGHT_RECORDS_API_PORT:-8000}:8000"
    volumes:
      - uploads:/tmp/townlight_records-uploads
      - cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    secrets:
      - jwt_secret
      - first_admin_password
    command: celery -A townlight_records.worker worker --loglevel=info
    volumes:
      - uploads:/tmp/townlight_records-uploads
      - cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A townlight_records.worker inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    secrets:
      - jwt_secret
      - first_admin_password
    command: celery -A townlight_records.worker beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${TOWNLIGHT_RECORDS_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  ollamadata:
  uploads:
  cache:

secrets:
  jwt_secret:
    file: ${TOWNLIGHT_RECORDS_SECRET_DIR:-./data/secrets}/jwt_secret
  first_admin_password:
    file: ${TOWNLIGHT_RECORDS_SECRET_DIR:-./data/secrets}/first_admin_password
