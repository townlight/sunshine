# Development overrides: hot reload, source mounting, debug ports
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn townlight_records.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/townlight_records:/app/townlight_records
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"

  worker:
    volumes:
      - ./backend/townlight_records:/app/townlight_records

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  ollama:
    ports:
      - "11434:11434"
