name: Windows component contracts
on:
  pull_request:
    paths: ["**/*.py", "**/pyproject.toml", ".github/workflows/windows-contracts.yml"]
  push:
    paths: ["**/*.py", "**/pyproject.toml", ".github/workflows/windows-contracts.yml"]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned shared Core
        run: python -m pip install git+https://github.com/townlight/core.git@3021821bf9a92c790a399ad12aed821d65b09105
      - name: Install component and test tools
        run: python -m pip install -e ".[dev]" pytest
      - name: Prepare isolated Windows PostgreSQL fixture
        working-directory: .
        shell: pwsh
        run: ./.github/scripts/prepare-windows-test-db.ps1 -WithVector
      - name: Run existing Windows contracts
        run: python -X utf8 -m pytest tests/test_base_connector.py tests/test_circuit_breaker.py -q --junitxml=windows-contracts.xml
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contract-results
          path: backend/windows-contracts.xml
          retention-days: 7
      - name: Stop owned test database
        if: always()
        working-directory: .
        shell: pwsh
        run: |
          $cluster = Join-Path $env:RUNNER_TEMP 'townlight-test-pg'
          if (Test-Path (Join-Path $cluster 'postmaster.pid')) {
            & "$env:PGBIN/pg_ctl.exe" -D $cluster -m fast -w stop
            if ($LASTEXITCODE -ne 0) { throw 'Owned test database did not stop.' }
          }
